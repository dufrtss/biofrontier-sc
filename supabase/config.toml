# Supabase project configuration, pushed with `supabase config push`.
#
# Only the settings this project actually depends on are declared. Secrets are
# read from the environment via env(...) so nothing sensitive is committed —
# see .env.example for the variables involved.

project_id = "ntgupaqcyjfnqpwshaqu"

[auth]
# Magic links are the only way into this app, so the redirect allow-list is
# load-bearing rather than incidental: `useAuth` passes the current page as
# emailRedirectTo, and a URL missing from this list silently sends the user to
# site_url instead of back to the hexbin they were looking at.
# The team-scoped `<project>-<team>.vercel.app` hostname used to live here, and
# it is protected by Vercel SSO: every magic link landed on a Vercel login wall
# instead of the app. Only publicly reachable hostnames belong in these fields.
site_url = "https://biofrontier.sc.eduardofrafre.com"
additional_redirect_urls = [
  "https://biofrontier.sc.eduardofrafre.com/**",
  "https://biofrontier-sc.vercel.app/**",
  # The team-scoped hostname. It is not a hostname anyone should be sent to,
  # but Vercel's Supabase integration rewrites `site_url` to it on every
  # deployment, so it is allow-listed to keep a link usable in the window
  # between that rewrite and the next `supabase config push`.
  "https://biofrontier-sc-eduardo-freitas-projects.vercel.app/**",
  # Legacy alias from when the Vercel project was still called `omega`. Still
  # serving, so links already in someone's inbox keep working.
  "https://omega-six-tau.vercel.app/**",
  "http://localhost:3000/**",
]

enable_signup = true
# Sessions outlive a field trip; a biologist should not be signed out between
# recording an observation and confirming someone else's.
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
# No password is ever collected, so there is no confirmation step to skip:
# clicking the emailed link is itself the proof of address.
enable_confirmations = true
secure_password_change = false
# Supabase's own defaults, restated deliberately. Omitting a field here does not
# leave the remote value alone — `config push` overwrites it with the CLI's
# default, so anything not written down is silently reset. `max_frequency` in
# particular is the throttle that stops the sign-in form being used to bomb a
# third party's inbox.
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
# `onboarding@resend.dev` is Resend's shared sandbox sender, which only delivers
# to the account owner's own address — useless for a class. `mail.` rather than
# the apex on purpose: this app mails people who do not own the domain, and a
# sender reputation problem should not reach personal mail at eduardofrafre.com.
admin_email = "no-reply@mail.eduardofrafre.com"
sender_name = "BioFrontier SC"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
# Restated for the same reason: the CLI defaults these to false, while the
# project had them enabled. A blank section here is a downgrade, not a no-op.
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# The built-in Supabase sender allows a handful of messages per hour, which is
# unusable for a class. Custom SMTP lifts that, but a limit still belongs here:
# this is the ceiling on how fast someone could use the sign-in form to send
# mail to third parties.
email_sent = 30
