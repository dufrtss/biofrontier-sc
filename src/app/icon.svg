<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BioFrontier SC">
  <title>BioFrontier SC</title>
  <!-- Three H3-style cells: two sampled, filled, and one still empty, drawn as
       an outline. That empty cell is what the atlas looks for. Same geometry
       as src/components/ui/Mark.tsx: if one moves, move the other.

       Sized for 16px, the only size a browser tab renders. The gaps between
       cells and the 20-unit outline are the smallest that keep three separate
       cells at that size; tighter and they merge into one blob. -->
  <polygon points="70.8,24.0 117.6,51.0 117.6,105.0 70.8,132.0 24.1,105.0 24.1,51.0" fill="#4c9c2e"/>
  <polygon points="185.2,24.0 231.9,51.0 231.9,105.0 185.2,132.0 138.4,105.0 138.4,51.0" fill="#4c9c2e"/>
  <polygon points="128.0,134.0 165.2,155.5 165.2,198.5 128.0,220.0 90.8,198.5 90.8,155.5" fill="none" stroke="#4c9c2e" stroke-width="20" stroke-linejoin="round"/>
</svg>
