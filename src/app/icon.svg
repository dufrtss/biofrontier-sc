<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BioFrontier SC">
  <title>BioFrontier SC</title>
  <!-- Derived from the `bird` glyph in Phosphor Icons (MIT), recoloured to the
       brand green. Full notice in THIRD-PARTY-NOTICES.md — the licence requires
       it to travel with the copy, so it stays there even if this file moves.

       The stroke is not decoration: at 16px, which is the only size a browser
       tab renders, the bare outline thins to a smudge and stops reading as a
       bird. Painting the path with a 9-unit stroke in its own colour thickens
       every limb just enough to survive that, while leaving the eye and the
       wing open — at 13 they start closing up, at 5 the 16px render is still
       soft. Same file for the favicon and the header logo, so there is one
       shape to keep in sync rather than two. -->
